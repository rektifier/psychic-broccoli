[package]
name = "psychic-broccoli"
version = "0.4.2"
description = "Desktop HTTP client that reads and writes .http files"
authors = ["Mikael Ribeiro"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "psychic_broccoli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", features = ["json", "stream"] }
base64 = "0.23"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
url = "2"
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
azure_identity = { version = "1.0", optional = true }
azure_security_keyvault_secrets = { version = "1.0", optional = true }

[features]
default = ["keyvault"]
keyvault = ["dep:azure_identity", "dep:azure_security_keyvault_secrets"]

